apiVersion: v1
kind: Namespace
metadata:
  name: jenkins

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins
  namespace: jenkins
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/log
      - secrets
      - configmaps
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - update
      - patch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - update
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins
  namespace: jenkins
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
roleRef:
  kind: Role
  name: jenkins
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-home
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 20Gi

  storageClassName: standard

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1

  selector:
    matchLabels:
      app: jenkins

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: jenkins

    spec:
      serviceAccountName: jenkins

      securityContext:
        fsGroup: 1000

      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk21

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

            - name: agent
              containerPort: 50000

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"

            limits:
              cpu: "2"
              memory: "3Gi"

          env:
            - name: JAVA_OPTS
              value: >-
                -Xms512m
                -Xmx2g

          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home

          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5

      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home

---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins

spec:
  type: NodePort

  selector:
    app: jenkins

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

    - name: agent
      protocol: TCP
      port: 50000
      targetPort: 50000
      nodePort: 30050